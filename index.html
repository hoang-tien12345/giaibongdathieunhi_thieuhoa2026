<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Alivia Cup 2026 - Kết quả & Bảng xếp hạng</title>
<style>
  :root{
    --navy-deep:#0a1128;
    --navy:#0f1a3d;
    --navy-card:#131f4a;
    --gold:#f5b942;
    --gold-soft:#e8a93a;
    --teal:#2bb3a3;
    --text:#eef1fb;
    --text-dim:#9aa4c7;
    --line:#26305c;
    --win:#2bb3a3;
    --draw:#f5b942;
    --loss:#e05a5a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:radial-gradient(circle at 20% 0%, #16215a 0%, var(--navy-deep) 55%);
    color:var(--text);
    min-height:100vh;
    padding-bottom:60px;
  }
  header.hero{
    text-align:center;
    padding:34px 16px 22px;
    border-bottom:3px solid var(--gold);
    background:linear-gradient(180deg, rgba(245,185,66,0.08), transparent);
  }
  .cup-icon{font-size:38px;}
  h1{
    margin:8px 0 2px;
    font-size:clamp(22px,4vw,34px);
    letter-spacing:1px;
    color:var(--gold);
    text-transform:uppercase;
    font-weight:800;
  }
  header.hero p{margin:0;color:var(--text-dim);font-size:14px;letter-spacing:0.5px;}

  .admin-bar{
    max-width:900px;margin:18px auto 0;padding:0 16px;
    display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;
  }
  .admin-bar input{
    background:var(--navy-card);border:1px solid var(--line);color:var(--text);
    padding:9px 12px;border-radius:8px;font-size:14px;width:200px;
  }
  .admin-bar button{
    background:var(--gold);color:#1a1a1a;border:none;padding:9px 16px;border-radius:8px;
    font-weight:700;cursor:pointer;font-size:14px;transition:transform .12s;
  }
  .admin-bar button:hover{transform:translateY(-1px);}
  .admin-bar button.logout{background:transparent;border:1px solid var(--loss);color:var(--loss);}
  .status-pill{
    font-size:12px;padding:5px 12px;border-radius:20px;background:var(--navy-card);
    border:1px solid var(--line);color:var(--text-dim);
  }
  .status-pill.on{border-color:var(--teal);color:var(--teal);}

  nav.tabs{
    max-width:900px;margin:22px auto 0;padding:0 16px;
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  }
  nav.tabs button{
    background:var(--navy-card);color:var(--text-dim);border:1px solid var(--line);
    padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;font-size:14px;font-weight:600;
  }
  nav.tabs button.active{background:var(--navy);color:var(--gold);border-bottom:3px solid var(--gold);}

  main{max-width:900px;margin:0 auto;padding:0 16px;}
  .day-block{margin-top:26px;}
  .day-title{
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(90deg, var(--teal), transparent);
    padding:9px 14px;border-radius:8px;font-weight:700;font-size:15px;margin-bottom:10px;
  }
  .day-title.stage{background:linear-gradient(90deg, var(--gold-soft), transparent);color:#1a1a1a;}

  table{width:100%;border-collapse:collapse;background:var(--navy-card);border-radius:10px;overflow:hidden;}
  th,td{padding:10px 8px;text-align:center;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{background:#182350;color:var(--gold);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;}
  tr:last-child td{border-bottom:none;}
  .team-cell{text-align:right;font-weight:600;}
  .team-cell.left{text-align:left;}
  .group-chip{
    display:inline-block;min-width:22px;padding:2px 6px;border-radius:5px;font-weight:800;font-size:12px;
    background:var(--teal);color:#04241e;
  }
  .score-box{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;color:var(--gold);}
  .score-input{
    width:34px;padding:4px 2px;text-align:center;border-radius:6px;border:1px solid var(--gold);
    background:#0d1533;color:var(--text);font-weight:700;
  }
  .not-played{color:var(--text-dim);font-size:12px;}

  .standings-wrap{margin-top:26px;}
  .group-heading{
    font-size:16px;font-weight:800;color:var(--gold);margin:24px 0 8px;
    display:flex;align-items:center;gap:8px;
  }
  .standings-table td.team{text-align:left;font-weight:600;}
  .standings-table td.rank{font-weight:800;color:var(--teal);width:28px;}
  .standings-table tr.rank-1 td.team{color:var(--gold);}
  .standings-table tr.rank-2 td.team{color:#cfd6ee;}

  footer{text-align:center;color:var(--text-dim);font-size:12px;margin-top:40px;padding:0 16px;}
  .save-note{text-align:center;font-size:12px;color:var(--text-dim);margin-top:8px;}
  .loading-msg{text-align:center;color:var(--text-dim);padding:40px 0;font-size:14px;}

  .player-form{
    background:var(--navy-card);border:1px solid var(--line);border-radius:10px;
    padding:14px;margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .player-form input, .player-form select{
    background:#0d1533;border:1px solid var(--line);color:var(--text);
    padding:8px 10px;border-radius:8px;font-size:13.5px;
  }
  .player-form input[type="text"]{width:150px;}
  .player-form input[type="number"]{width:70px;}
  .player-form select{width:150px;}
  .player-form .field-label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:2px;}
  .player-form .field{display:flex;flex-direction:column;}
  .player-form .add-btn{
    background:var(--teal);color:#04241e;border:none;padding:9px 18px;border-radius:8px;
    font-weight:700;cursor:pointer;font-size:13.5px;align-self:flex-end;
  }
  .players-table td.pname{text-align:left;font-weight:600;}
  .players-table td.pteam{text-align:left;color:var(--text-dim);}
  .badge-yellow{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--draw);color:#3a2a00;font-weight:800;font-size:12px;}
  .badge-red{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--loss);color:#3a0000;font-weight:800;font-size:12px;}
  .del-btn{background:transparent;border:1px solid var(--loss);color:var(--loss);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:700;}
  .qualified-tag{font-size:11px;color:var(--teal);}
  @media(max-width:520px){
    th,td{font-size:11.5px;padding:7px 4px;}
    .score-input{width:26px;}
    .player-form input[type="text"], .player-form select{width:110px;}
  }
</style>

<script>
const ADMIN_PASSWORD = "0919992836";
let isAdmin = false;

function showMessage(text, isError=true){
  let box = document.getElementById('toastMsg');
  if(!box){
    box = document.createElement('div');
    box.id = 'toastMsg';
    box.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 20px;border-radius:8px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);';
    document.body.appendChild(box);
  }
  box.style.background = isError ? '#e05a5a' : '#2bb3a3';
  box.style.color = '#fff';
  box.textContent = text;
  box.style.display = 'block';
  clearTimeout(box._hideTimer);
  box._hideTimer = setTimeout(()=>{ box.style.display = 'none'; }, 2500);
}

const groups = {
  A: ['Đoán Quyết','Dương Hòa','Thiệu Long','Thành Lý'],
  B: ['Ngọc Phú','Minh Thượng','Mật Thôn','Thiệu Phú'],
  C: ['Xuân Quan','Minh Long','Tra Thôn'],
  D: ['Thiệu Công','Thiệu Nguyên','Phú Hưng'],
  E: ['Thiệu Phúc','Trung Sơn','Thành Đồng'],
  F: ['Đình Tân','Trí Cẩn','Vạn Hà']
};

function findGroup(t1, t2){
  for(const g in groups){
    if(groups[g].includes(t1) && groups[g].includes(t2)) return g;
  }
  return null;
}

// Group-stage matches
const rawMatches = [
  {no:1, date:'01/8', time:'15h30', t1:'Đoán Quyết', t2:'Dương Hòa', venue:1},
  {no:2, date:'01/8', time:'15h30', t1:'Thiệu Long', t2:'Thành Lý', venue:2},
  {no:3, date:'01/8', time:'16h35', t1:'Ngọc Phú', t2:'Minh Thượng', venue:1},
  {no:4, date:'01/8', time:'16h35', t1:'Thiệu Phú', t2:'Mật Thôn', venue:2},
  {no:5, date:'02/8', time:'6h30', t1:'Xuân Quan', t2:'Minh Long', venue:1},
  {no:6, date:'02/8', time:'6h30', t1:'Thiệu Công', t2:'Thiệu Nguyên', venue:2},
  {no:7, date:'02/8', time:'7h35', t1:'Thiệu Phúc', t2:'Trung Sơn', venue:1},
  {no:8, date:'02/8', time:'7h35', t1:'Đình Tân', t2:'Trí Cẩn', venue:2},
  {no:9, date:'02/8', time:'15h30', t1:'Dương Hòa', t2:'Thành Lý', venue:1},
  {no:10, date:'02/8', time:'15h30', t1:'Đoán Quyết', t2:'Thiệu Long', venue:2},
  {no:11, date:'02/8', time:'16h35', t1:'Minh Thượng', t2:'Mật Thôn', venue:1},
  {no:12, date:'02/8', time:'16h35', t1:'Ngọc Phú', t2:'Thiệu Phú', venue:2},
  {no:13, date:'03/8', time:'15h30', t1:'Xuân Quan', t2:'Tra Thôn', venue:2},
  {no:14, date:'03/8', time:'15h30', t1:'Thiệu Công', t2:'Phú Hưng', venue:1},
  {no:15, date:'03/8', time:'16h35', t1:'Thiệu Phúc', t2:'Thành Đồng', venue:2},
  {no:16, date:'03/8', time:'16h35', t1:'Đình Tân', t2:'Vạn Hà', venue:1},
  {no:17, date:'04/8', time:'6h30', t1:'Đoán Quyết', t2:'Thành Lý', venue:2},
  {no:18, date:'04/8', time:'6h30', t1:'Dương Hòa', t2:'Thiệu Long', venue:1},
  {no:19, date:'04/8', time:'7h35', t1:'Ngọc Phú', t2:'Mật Thôn', venue:2},
  {no:20, date:'04/8', time:'7h35', t1:'Minh Thượng', t2:'Thiệu Phú', venue:1},
  {no:21, date:'04/8', time:'15h30', t1:'Minh Long', t2:'Tra Thôn', venue:2},
  {no:22, date:'04/8', time:'15h30', t1:'Thiệu Nguyên', t2:'Phú Hưng', venue:1},
  {no:23, date:'04/8', time:'16h35', t1:'Trung Sơn', t2:'Thành Đồng', venue:2},
  {no:24, date:'04/8', time:'16h35', t1:'Trí Cẩn', t2:'Vạn Hà', venue:1},
];
rawMatches.forEach(m=> m.group = findGroup(m.t1, m.t2));

// Knockout matches (no group standings impact)
const koMatches = [
  {id:'TK1', stageLabel:'Vòng Tứ Kết', date:'05/8', time:'15h30', t1:'Nhất A', t2:'Nhì B', venue:1},
  {id:'TK2', stageLabel:'Vòng Tứ Kết', date:'05/8', time:'15h30', t1:'Nhất B', t2:'Nhì A', venue:2},
  {id:'TK3', stageLabel:'Vòng Tứ Kết', date:'05/8', time:'16h35', t1:'Nhất D', t2:'Nhất C', venue:1},
  {id:'TK4', stageLabel:'Vòng Tứ Kết', date:'05/8', time:'16h35', t1:'Nhất E', t2:'Nhất F', venue:2},
  {id:'BK1', stageLabel:'Vòng Bán Kết', date:'06/8', time:'15h30', t1:'Thắng TK1', t2:'Thắng TK2', venue:1},
  {id:'BK2', stageLabel:'Vòng Bán Kết', date:'06/8', time:'16h35', t1:'Thắng TK3', t2:'Thắng TK4', venue:1},
  {id:'TG3', stageLabel:'Trận Tranh Giải Ba', date:'09/8', time:'15h30', t1:'Thua BK1', t2:'Thua BK2', venue:1},
  {id:'CK', stageLabel:'Trận Chung Kết', date:'09/8', time:'16h30', t1:'Thắng BK1', t2:'Thắng BK2', venue:1},
];

const allTeams = Object.values(groups).flat();

function isKnockoutMatch(matchId){
  return koMatches.some(m => m.id === matchId);
}

let scores = {}; // { "1": {s1:2, s2:0}, "TK1": {...} }
const SCORES_KEY = 'alivia_cup_scores_2026';

// Resolves a placeholder like "Nhất A" / "Thắng TK1" / "Thua BK2" into the real
// team name once enough score data exists, otherwise returns the placeholder as-is.
function resolveTeamName(name){
  const groupMatch = name.match(/^(Nhất|Nhì) ([A-F])$/);
  if(groupMatch){
    const rankIdx = groupMatch[1] === 'Nhất' ? 0 : 1;
    const group = groupMatch[2];
    const groupMatchesTotal = rawMatches.filter(m=>m.group===group).length;
    const groupMatchesPlayed = rawMatches.filter(m=>{
      const sc = scores[m.no];
      return m.group===group && sc && sc.s1!==undefined && sc.s1!=='';
    }).length;
    if(groupMatchesPlayed === groupMatchesTotal){
      const standings = computeStandings(group);
      if(standings[rankIdx]) return standings[rankIdx].team;
    }
    return name;
  }
  const koMatch = name.match(/^(Thắng|Thua) (.+)$/);
  if(koMatch){
    const matchId = koMatch[2];
    const sc = scores[matchId];
    if(sc && sc.s1!==undefined && sc.s1!==''){
      const s1 = Number(sc.s1), s2 = Number(sc.s2);
      let decided = null; // true = t1 thắng, false = t2 thắng, null = chưa xác định
      if(s1 !== s2){
        decided = s1 > s2;
      } else if(sc.p1!==undefined && sc.p1!=='' && sc.p2!==undefined && sc.p2!=='' && Number(sc.p1)!==Number(sc.p2)){
        decided = Number(sc.p1) > Number(sc.p2);
      }
      if(decided !== null){
        const match = koMatches.find(km=>km.id===matchId);
        if(!match) return name;
        const t1 = resolveTeamName(match.t1);
        const t2 = resolveTeamName(match.t2);
        const winner = decided ? t1 : t2;
        const loser = decided ? t2 : t1;
        return koMatch[1] === 'Thắng' ? winner : loser;
      }
    }
    return name;
  }
  return name;
}

async function loadScores(){
  try{
    const snap = await db.ref(SCORES_KEY).get();
    scores = snap.exists() ? snap.val() : {};
  }catch(e){
    // key doesn't exist yet, that's fine on first run
    scores = {};
  }
}

async function saveScore(matchId, s1, s2, p1, p2){
  scores[matchId] = {s1, s2};
  if(p1 !== undefined && p2 !== undefined){
    scores[matchId].p1 = p1;
    scores[matchId].p2 = p2;
  }
  try{
    await db.ref(SCORES_KEY).set(scores);
  }catch(e){
    showMessage('Lỗi khi lưu tỉ số, vui lòng thử lại.');
  }
}

// Tự động cập nhật khi có người khác sửa điểm (đồng bộ realtime cho mọi người xem)
db.ref(SCORES_KEY).on('value', (snap)=>{
  scores = snap.exists() ? snap.val() : {};
  if(typeof renderSchedule === 'function') renderSchedule();
  if(typeof renderStandings === 'function') renderStandings();
});

function login(){
  const val = document.getElementById('pwInput').value;
  if(val === ADMIN_PASSWORD){
    isAdmin = true;
    document.getElementById('statusPill').textContent = 'Đang đăng nhập Admin';
    document.getElementById('statusPill').classList.add('on');
    document.getElementById('adminBar').innerHTML =
      '<span class="status-pill on">Đang đăng nhập Admin</span> <button class="logout" onclick="logout()">Đăng xuất</button>';
    renderSchedule();
    renderPlayers();
  } else {
    showMessage('Sai mật khẩu quản trị.');
  }
}
function logout(){
  isAdmin = false;
  location.reload();
}

function scoreCell(matchId){
  const sc = scores[matchId];
  const s1 = sc ? sc.s1 : '';
  const s2 = sc ? sc.s2 : '';
  const knockout = isKnockoutMatch(matchId);
  const p1 = (sc && sc.p1!==undefined) ? sc.p1 : '';
  const p2 = (sc && sc.p2!==undefined) ? sc.p2 : '';

  if(isAdmin){
    let html = `<div class="score-box">
      <input class="score-input" type="number" min="0" id="s1_${matchId}" value="${s1}" ${knockout ? `oninput="checkTie('${matchId}')"` : ''}>
      <span>-</span>
      <input class="score-input" type="number" min="0" id="s2_${matchId}" value="${s2}" ${knockout ? `oninput="checkTie('${matchId}')"` : ''}>
      <button style="margin-left:6px;padding:4px 8px;font-size:11px;border-radius:6px;border:none;background:var(--teal);color:#04241e;font-weight:700;cursor:pointer;" onclick="submitScore('${matchId}')">Lưu</button>
    </div>`;
    if(knockout){
      const showPenalty = (s1 !== '' && s2 !== '' && Number(s1) === Number(s2));
      html += `<div id="pen_${matchId}" style="margin-top:4px;font-size:11px;color:var(--text-dim);white-space:nowrap;${showPenalty ? '' : 'display:none;'}">
        Luân lưu (nếu hòa):
        <input class="score-input" style="width:26px;" type="number" min="0" id="p1_${matchId}" value="${p1}">
        <span>-</span>
        <input class="score-input" style="width:26px;" type="number" min="0" id="p2_${matchId}" value="${p2}">
      </div>`;
    }
    return html;
  }

  if(sc && sc.s1 !== '' && sc.s1 !== undefined){
    if(Number(sc.s1) === Number(sc.s2) && knockout){
      if(p1!=='' && p2!=='' && Number(p1)!==Number(p2)){
        return `<div class="score-box">${sc.s1} - ${sc.s2} <span style="font-size:11px;color:var(--text-dim);font-weight:600;">(luân lưu ${p1}-${p2})</span></div>`;
      }
      return `<div class="score-box">${sc.s1} - ${sc.s2} <span style="font-size:11px;color:var(--text-dim);font-weight:600;">(hòa - chờ luân lưu)</span></div>`;
    }
    return `<div class="score-box">${sc.s1} - ${sc.s2}</div>`;
  }
  return `<span class="not-played">chưa đá</span>`;
}

function checkTie(matchId){
  const penDiv = document.getElementById('pen_'+matchId);
  if(!penDiv) return;
  const s1 = document.getElementById('s1_'+matchId).value;
  const s2 = document.getElementById('s2_'+matchId).value;
  const isTie = (s1 !== '' && s2 !== '' && Number(s1) === Number(s2));
  penDiv.style.display = isTie ? 'block' : 'none';
}

async function submitScore(matchId){
  const s1 = document.getElementById('s1_'+matchId).value;
  const s2 = document.getElementById('s2_'+matchId).value;
  if(s1 === '' || s2 === ''){ showMessage('Nhập đủ tỉ số hai đội.'); return; }

  const payload = {s1: Number(s1), s2: Number(s2)};

  if(isKnockoutMatch(matchId) && Number(s1) === Number(s2)){
    const p1El = document.getElementById('p1_'+matchId);
    const p2El = document.getElementById('p2_'+matchId);
    const p1 = p1El ? p1El.value : '';
    const p2 = p2El ? p2El.value : '';
    if(p1 === '' || p2 === ''){
      showMessage('Hai đội hòa nhau, nhập thêm tỉ số luân lưu để xác định đội thắng.');
      return;
    }
    if(Number(p1) === Number(p2)){
      showMessage('Tỉ số luân lưu không được hòa nhau.');
      return;
    }
    payload.p1 = Number(p1);
    payload.p2 = Number(p2);
  }

  await saveScore(matchId, payload.s1, payload.s2, payload.p1, payload.p2);
  renderSchedule();
  renderStandings();
}

function renderSchedule(){
  const days = [...new Set(rawMatches.map(m=>m.date))];
  let html = '';
  days.forEach(day=>{
    html += `<div class="day-block"><div class="day-title">📅 Ngày ${day}</div>`;
    html += `<table><thead><tr><th>Giờ</th><th>Bảng</th><th>Trận</th><th colspan="3">Đội 1 - Tỉ số - Đội 2</th><th>Sân</th></tr></thead><tbody>`;
    rawMatches.filter(m=>m.date===day).forEach(m=>{
      html += `<tr>
        <td>${m.time}</td>
        <td><span class="group-chip">${m.group||'-'}</span></td>
        <td>${m.no}</td>
        <td class="team-cell">${m.t1}</td>
        <td>${scoreCell(m.no)}</td>
        <td class="team-cell left">${m.t2}</td>
        <td>${m.venue}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });

  // Knockout stages grouped by stageLabel
  const stages = [...new Set(koMatches.map(m=>m.stageLabel))];
  stages.forEach(stage=>{
    html += `<div class="day-block"><div class="day-title stage">🏅 ${stage}</div>`;
    html += `<table><thead><tr><th>Ngày</th><th>Giờ</th><th colspan="3">Đội 1 - Tỉ số - Đội 2</th><th>Sân</th></tr></thead><tbody>`;
    koMatches.filter(m=>m.stageLabel===stage).forEach(m=>{
      const t1 = resolveTeamName(m.t1);
      const t2 = resolveTeamName(m.t2);
      html += `<tr>
        <td>${m.date}</td>
        <td>${m.time}</td>
        <td class="team-cell">${t1}</td>
        <td>${scoreCell(m.id)}</td>
        <td class="team-cell left">${t2}</td>
        <td>${m.venue}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });

  document.getElementById('scheduleView').innerHTML = html;
  document.getElementById('scheduleView').classList.remove('loading-msg');
}

function computeStandings(group){
  const teamStats = {};
  groups[group].forEach(t=>{
    teamStats[t] = {team:t, played:0, win:0, draw:0, loss:0, gf:0, ga:0, pts:0};
  });
  rawMatches.filter(m=>m.group===group).forEach(m=>{
    const sc = scores[m.no];
    if(!sc || sc.s1===undefined || sc.s1==='' ) return;
    const s1 = Number(sc.s1), s2 = Number(sc.s2);
    const a = teamStats[m.t1], b = teamStats[m.t2];
    a.played++; b.played++;
    a.gf += s1; a.ga += s2;
    b.gf += s2; b.ga += s1;
    if(s1 > s2){ a.win++; a.pts+=3; b.loss++; }
    else if(s1 < s2){ b.win++; b.pts+=3; a.loss++; }
    else { a.draw++; b.draw++; a.pts++; b.pts++; }
  });
  return Object.values(teamStats).sort((x,y)=>{
    if(y.pts !== x.pts) return y.pts - x.pts;
    const gdX = x.gf-x.ga, gdY = y.gf-y.ga;
    if(gdY !== gdX) return gdY - gdX;
    return y.gf - x.gf;
  });
}

function renderStandings(){
  let html = '<div class="standings-wrap">';
  Object.keys(groups).forEach(g=>{
    const table = computeStandings(g);
    html += `<div class="group-heading"><span class="group-chip">${g}</span> Bảng ${g}</div>`;
    html += `<table class="standings-table"><thead><tr>
      <th>#</th><th style="text-align:left;">Đội</th><th>Trận</th><th>Thắng</th><th>Hòa</th><th>Thua</th><th>Bàn thắng</th><th>Bàn thua</th><th>Hiệu số</th><th>Điểm</th>
    </tr></thead><tbody>`;
    table.forEach((t,i)=>{
      html += `<tr class="rank-${i+1}">
        <td class="rank">${i+1}</td>
        <td class="team">${t.team}</td>
        <td>${t.played}</td>
        <td>${t.win}</td>
        <td>${t.draw}</td>
        <td>${t.loss}</td>
        <td>${t.gf}</td>
        <td>${t.ga}</td>
        <td>${t.gf-t.ga >= 0 ? '+' : ''}${t.gf-t.ga}</td>
        <td><b>${t.pts}</b></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });
  html += '</div><p class="save-note">Xếp hạng tự động cập nhật theo tỉ số các trận vòng bảng.</p>';
  document.getElementById('standingsView').innerHTML = html;
}

let playerStats = []; // [{id, name, team, goals, yellow, red}]
let playerStatsHistory = []; // stack of previous snapshots, for undo
const PLAYERS_KEY = 'alivia_cup_players_2026';

function snapshotPlayerStats(){
  playerStatsHistory.push(JSON.parse(JSON.stringify(playerStats)));
  if(playerStatsHistory.length > 20) playerStatsHistory.shift();
}

async function undoPlayerStats(){
  if(playerStatsHistory.length === 0){
    showMessage('Không có thao tác nào để hoàn tác.');
    return;
  }
  playerStats = playerStatsHistory.pop();
  await savePlayerStats();
  renderPlayers();
  showMessage('Đã hoàn tác thao tác gần nhất.', false);
}

document.addEventListener('keydown', (e)=>{
  const isUndo = (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z');
  if(!isUndo) return;
  const activeTag = document.activeElement ? document.activeElement.tagName : '';
  if(activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return; // để undo gõ chữ bình thường hoạt động
  e.preventDefault();
  undoPlayerStats();
});

async function loadPlayerStats(){
  try{
    const snap = await db.ref(PLAYERS_KEY).get();
    playerStats = snap.exists() ? snap.val() : [];
  }catch(e){
    playerStats = [];
  }
}

async function savePlayerStats(){
  try{
    await db.ref(PLAYERS_KEY).set(playerStats);
  }catch(e){
    showMessage('Lỗi khi lưu dữ liệu cầu thủ, vui lòng thử lại.');
  }
}

// Tự động cập nhật khi có người khác sửa dữ liệu cầu thủ
db.ref(PLAYERS_KEY).on('value', (snap)=>{
  playerStats = snap.exists() ? snap.val() : [];
  if(typeof renderPlayers === 'function') renderPlayers();
});

async function addPlayerStat(){
  const name = document.getElementById('newPlayerName').value.trim();
  const team = document.getElementById('newPlayerTeam').value;
  const goals = Number(document.getElementById('newPlayerGoals').value) || 0;
  const yellow = Number(document.getElementById('newPlayerYellow').value) || 0;
  const red = Number(document.getElementById('newPlayerRed').value) || 0;
  if(!name){ showMessage('Nhập tên cầu thủ.'); return; }
  snapshotPlayerStats();
  playerStats.push({id: 'p'+Date.now(), name, team, goals, yellow, red});
  await savePlayerStats();
  renderPlayers();
}

async function updatePlayerStat(id){
  const p = playerStats.find(x=>x.id===id);
  if(!p) return;
  snapshotPlayerStats();
  p.goals = Number(document.getElementById('goals_'+id).value) || 0;
  p.yellow = Number(document.getElementById('yellow_'+id).value) || 0;
  p.red = Number(document.getElementById('red_'+id).value) || 0;
  await savePlayerStats();
  renderPlayers();
}

async function deletePlayerStat(id){
  snapshotPlayerStats();
  playerStats = playerStats.filter(p=>p.id!==id);
  await savePlayerStats();
  renderPlayers();
}

function renderPlayers(){
  let html = '';
  if(isAdmin){
    const teamOptions = allTeams.map(t=>`<option value="${t}">${t}</option>`).join('');
    html += `<div class="player-form">
      <div class="field"><span class="field-label">Cầu thủ</span><input type="text" id="newPlayerName" placeholder="Tên cầu thủ"></div>
      <div class="field"><span class="field-label">Đội</span><select id="newPlayerTeam">${teamOptions}</select></div>
      <div class="field"><span class="field-label">Bàn thắng</span><input type="number" id="newPlayerGoals" min="0" value="0"></div>
      <div class="field"><span class="field-label">Thẻ vàng</span><input type="number" id="newPlayerYellow" min="0" value="0"></div>
      <div class="field"><span class="field-label">Thẻ đỏ</span><input type="number" id="newPlayerRed" min="0" value="0"></div>
      <button class="add-btn" onclick="addPlayerStat()">+ Thêm cầu thủ</button>
      <button class="add-btn" style="background:var(--gold-soft);" onclick="undoPlayerStats()">↩ Hoàn tác</button>
    </div>`;
  }

  const sorted = [...playerStats].sort((a,b)=> b.goals - a.goals);

  if(sorted.length === 0){
    html += `<p class="not-played">Chưa có dữ liệu cầu thủ.</p>`;
    document.getElementById('playersView').innerHTML = html;
    return;
  }

  html += `<table class="players-table"><thead><tr>
    <th style="text-align:left;">Cầu thủ</th><th style="text-align:left;">Đội</th><th>⚽ Bàn thắng</th><th>🟨 Thẻ vàng</th><th>🟥 Thẻ đỏ</th>${isAdmin ? '<th></th>' : ''}
  </tr></thead><tbody>`;
  sorted.forEach(p=>{
    if(isAdmin){
      html += `<tr>
        <td class="pname">${p.name}</td>
        <td class="pteam">${p.team}</td>
        <td><input class="score-input" type="number" min="0" id="goals_${p.id}" value="${p.goals}"></td>
        <td><input class="score-input" type="number" min="0" id="yellow_${p.id}" value="${p.yellow}"></td>
        <td><input class="score-input" type="number" min="0" id="red_${p.id}" value="${p.red}"></td>
        <td><button style="margin-right:4px;padding:4px 8px;font-size:11px;border-radius:6px;border:none;background:var(--teal);color:#04241e;font-weight:700;cursor:pointer;" onclick="updatePlayerStat('${p.id}')">Lưu</button><button class="del-btn" onclick="deletePlayerStat('${p.id}')">Xóa</button></td>
      </tr>`;
    } else {
      html += `<tr>
        <td class="pname">${p.name}</td>
        <td class="pteam">${p.team}</td>
        <td><b>${p.goals}</b></td>
        <td>${p.yellow > 0 ? `<span class="badge-yellow">${p.yellow}</span>` : '0'}</td>
        <td>${p.red > 0 ? `<span class="badge-red">${p.red}</span>` : '0'}</td>
      </tr>`;
    }
  });
  html += `</tbody></table><p class="save-note">Danh sách tự động sắp xếp theo số bàn thắng ghi được.</p>`;
  document.getElementById('playersView').innerHTML = html;
}

// Tabs
document.getElementById('tabs').addEventListener('click', (e)=>{
  if(e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const tab = e.target.dataset.tab;
  document.getElementById('scheduleView').style.display = tab==='schedule' ? 'block' : 'none';
  document.getElementById('standingsView').style.display = tab==='standings' ? 'block' : 'none';
  document.getElementById('playersView').style.display = tab==='players' ? 'block' : 'none';
});

(async function init(){
  await loadScores();
  await loadPlayerStats();
  renderSchedule();
  renderStandings();
  renderPlayers();
})();
</script>
</body>
</html>
